# Alembic configuration.
#
# The database URL is resolved in `alembic/env.py` from the environment
# (`DATABASE_URL_UNPOOLED`, falling back to the value in `.env`), so no
# credentials are stored here.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Timestamped revision filenames make the history easy to read.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Only the `app` schema is managed here. `neon_auth` is managed by Neon Auth.
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
